services:
  robinhood:
    build: .
    container_name: robinhood
    env_file:
      - .env
    volumes:
      - robinhood_tokens:/root/.tokens   # persist robin_stocks auth tokens across rebuilds
    # Keep container running and allow stdin interaction
    stdin_open: true # -i
    tty: false       # We want raw stdout/stdin for MCP, not a TTY
    restart: unless-stopped
    init: true       # PID 1 is a tiny reaper — cleans up orphaned node/python
                     # children left behind when `docker exec -i ... node index.js`
                     # wrappers die without signal propagation. Prevents the
                     # zombie-accumulation → OOM → "initialize timeout" loop.

volumes:
  robinhood_tokens:
